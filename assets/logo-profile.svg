<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <!-- Background radial gradient -->
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%"   stop-color="#18224a"/>
      <stop offset="100%" stop-color="#080c18"/>
    </radialGradient>

    <!-- Brand gradient (diagonal, document coords) -->
    <linearGradient id="brand-p" x1="124" y1="103" x2="278" y2="295" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="50%"  stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Active line gradient (horizontal) -->
    <linearGradient id="active-p" x1="140" y1="0" x2="214" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Outer ring gradient -->
    <linearGradient id="ring" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%"  stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Aura radial behind doc -->
    <radialGradient id="aura-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#818cf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Cursor glow filter -->
    <filter id="glow-p" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Doc soft glow -->
    <filter id="doc-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- ── Subtle dot grid ── -->
  <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1" fill="#ffffff" opacity="0.04"/>
  </pattern>
  <rect width="400" height="400" fill="url(#dots)"/>

  <!-- ── Aura behind document ── -->
  <ellipse cx="200" cy="199" rx="96" ry="118" fill="url(#aura-r)" filter="url(#doc-glow)"/>

  <!-- ── Document body: 154 × 192, centered at (200, 199) ──
       x=123, y=103  →  right=277, bottom=295
       fold=46  →  notch=(231, 103), fold-corner=(277, 149) -->
  <path d="M123,115 Q123,103 135,103 L231,103 L277,149 L277,283 Q277,295 265,295 L135,295 Q123,295 123,283 Z"
    fill="#0e1628" stroke="url(#brand-p)" stroke-width="2"/>

  <!-- ── Fold ── -->
  <path d="M231,103 L277,149 L231,149 Z"
    fill="#08101e" stroke="url(#brand-p)" stroke-width="1.5"/>

  <!-- ── Form lines: filled ── -->
  <line x1="140" y1="178" x2="261" y2="178"
    stroke="rgba(255,255,255,0.38)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="140" y1="210" x2="261" y2="210"
    stroke="rgba(255,255,255,0.38)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ── Active line (being filled) ── -->
  <line x1="140" y1="242" x2="214" y2="242"
    stroke="url(#active-p)" stroke-width="4" stroke-linecap="round"/>

  <!-- ── Cursor dot ── -->
  <circle cx="224" cy="242" r="8" fill="#c084fc" filter="url(#glow-p)"/>
  <circle cx="224" cy="242" r="4" fill="#e9d5ff"/>

  <!-- ── Outer ring ── -->
  <circle cx="200" cy="200" r="188" stroke="url(#ring)" stroke-width="1.5"/>

  <!-- ── Inner accent ring (tight, faint) ── -->
  <circle cx="200" cy="200" r="178" stroke="url(#ring)" stroke-width="0.5" opacity="0.4"/>
</svg>

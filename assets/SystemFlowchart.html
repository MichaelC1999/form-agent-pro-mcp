<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Immigration Form Filling — Production Data Flow</title>
<style>
  body { margin: 0; background: #0d1117; display: flex; justify-content: center; padding: 24px; }
</style>
</head>
<body>
<svg
  width="900" height="1000"
  viewBox="0 0 900 1000"
  xmlns="http://www.w3.org/2000/svg"
  style="background:#0d1117;display:block;font-family:'SF Mono','Fira Code',monospace"
>
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="am" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#484f58"/>
    </marker>
  </defs>

  <!-- ── Title ── -->
  <text x="450" y="30" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" letter-spacing=".4">
    Immigration Form Filling — Production Data Flow
  </text>

  <!-- ── Legend ── -->
  <!-- Input Data -->
  <rect x="15" y="50" width="10" height="10" rx="2" fill="#0d3349" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="29" y="59" fill="#8b949e" font-size="9.5">Input Data</text>
  <!-- Anthropic API -->
  <rect x="115" y="50" width="10" height="10" rx="2" fill="#2a1a3a" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="129" y="59" fill="#8b949e" font-size="9.5">Anthropic API</text>
  <!-- Service -->
  <rect x="235" y="50" width="10" height="10" rx="2" fill="#0d2a28" stroke="#80cbc4" stroke-width="1.5"/>
  <text x="249" y="59" fill="#8b949e" font-size="9.5">Service / Process</text>
  <!-- MongoDB -->
  <rect x="375" y="50" width="10" height="10" rx="2" fill="#3a2200" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="389" y="59" fill="#8b949e" font-size="9.5">MongoDB Object</text>
  <!-- Output -->
  <rect x="505" y="50" width="10" height="10" rx="2" fill="#1a2e1a" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="519" y="59" fill="#8b949e" font-size="9.5">Output Artifact</text>
  <!-- Param -->
  <rect x="630" y="50" width="10" height="10" rx="2" fill="#1c2333" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="644" y="59" fill="#8b949e" font-size="9.5">Parameter</text>

  <!-- ══════════════════════════════════
       TRACK A — FORM SETUP (admin)
       ══════════════════════════════════ -->
  <!-- Track background -->
  <rect x="18" y="92" width="320" height="428" rx="8"
    fill="#161b22" stroke="#30363d" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="30" y="107" fill="#484f58" font-size="8.5" font-weight="700" letter-spacing="1.2">
    FORM SETUP · ADMIN — ONCE PER FORM
  </text>
  <text x="20" y="89" fill="#8b949e" font-size="8">POST /api/form-map/build · POST /api/form-context/build</text>

  <!-- Blank PDF (admin) -->
  <rect x="75" y="115" width="190" height="46" rx="6" fill="#0d3349" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="170" y="133" text-anchor="middle" fill="#4fc3f7" font-size="11" font-weight="600">Blank PDF Template</text>
  <text x="170" y="148" text-anchor="middle" fill="#8b949e" font-size="8.5">disk · /forms/&lt;formId&gt;.pdf</text>

  <!-- Arrow: Blank PDF → buildFormMap -->
  <line x1="170" y1="161" x2="170" y2="194" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- buildFormMap -->
  <rect x="75" y="200" width="190" height="46" rx="6" fill="#0d2a28" stroke="#80cbc4" stroke-width="1.5"/>
  <text x="170" y="218" text-anchor="middle" fill="#80cbc4" font-size="11" font-weight="600">buildFormMap</text>
  <text x="170" y="233" text-anchor="middle" fill="#8b949e" font-size="8.5">pdftk → pdf-lib → qpdf → raw-scan</text>

  <!-- Arrow: buildFormMap → FormMap -->
  <line x1="170" y1="246" x2="170" y2="279" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- FormMap (MongoDB) -->
  <rect x="75" y="285" width="190" height="46" rx="6" fill="#3a2200" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="170" y="303" text-anchor="middle" fill="#ffb74d" font-size="11" font-weight="600">[form]-map</text>
  <text x="170" y="318" text-anchor="middle" fill="#8b949e" font-size="8.5">MongoDB · empty field IDs</text>

  <!-- Arrow: FormMap → buildFormContext -->
  <line x1="170" y1="331" x2="170" y2="364" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- Blank PDF also feeds buildFormContext (dashed side route) -->
  <path d="M265,138 L310,138 L310,393 L270,393" fill="none"
    stroke="#484f58" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#am)"/>
  <text x="312" y="270" fill="#484f58" font-size="8" transform="rotate(-90,312,270)">reads blank PDF</text>

  <!-- buildFormContext -->
  <rect x="75" y="370" width="190" height="46" rx="6" fill="#2a1a3a" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="170" y="388" text-anchor="middle" fill="#ce93d8" font-size="11" font-weight="600">buildFormContext</text>
  <text x="170" y="403" text-anchor="middle" fill="#8b949e" font-size="8.5">Anthropic fn · claude-opus-4-5</text>

  <!-- Arrow: buildFormContext → FormContext -->
  <line x1="170" y1="416" x2="170" y2="449" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- FormContext (MongoDB) -->
  <rect x="75" y="455" width="190" height="46" rx="6" fill="#3a2200" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="170" y="473" text-anchor="middle" fill="#ffb74d" font-size="11" font-weight="600">[form]-context</text>
  <text x="170" y="488" text-anchor="middle" fill="#8b949e" font-size="8.5">MongoDB · annotated field descriptions</text>

  <!-- ═══════════════════════════════════════
       TRACK B — USER DATA COLLECTION
       ═══════════════════════════════════════ -->
  <rect x="358" y="92" width="524" height="260" rx="8"
    fill="#161b22" stroke="#30363d" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="370" y="107" fill="#484f58" font-size="8.5" font-weight="700" letter-spacing="1.2">
    USER DATA COLLECTION · ONCE PER USER SESSION
  </text>
  <text x="360" y="89" fill="#8b949e" font-size="8">POST /api/situation/build</text>

  <!-- User Documents -->
  <rect x="370" y="115" width="190" height="46" rx="6" fill="#0d3349" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="465" y="133" text-anchor="middle" fill="#4fc3f7" font-size="11" font-weight="600">User Documents</text>
  <text x="465" y="148" text-anchor="middle" fill="#8b949e" font-size="8.5">multipart · passports, visas, I-94…</text>

  <!-- UI Answers -->
  <rect x="578" y="115" width="295" height="46" rx="6" fill="#1c2333" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="725" y="133" text-anchor="middle" fill="#90a4ae" font-size="11" font-weight="600">UI Answers</text>
  <text x="725" y="148" text-anchor="middle" fill="#8b949e" font-size="8.5">situationDescription · processDescription · additionalNotes</text>

  <!-- Arrow: User Docs → buildSituationContext -->
  <line x1="465" y1="161" x2="465" y2="194" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- Arrow: UI Answers → buildSituationContext (elbow) -->
  <path d="M725,161 L725,178 L465,178" fill="none"
    stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- buildSituationContext -->
  <rect x="370" y="200" width="190" height="46" rx="6" fill="#2a1a3a" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="465" y="217" text-anchor="middle" fill="#ce93d8" font-size="11" font-weight="600">buildSituationContext</text>
  <text x="465" y="232" text-anchor="middle" fill="#8b949e" font-size="8.5">OCR / pdf-parse + Anthropic fn</text>

  <!-- Arrow: buildSituationContext → SituationalContext -->
  <line x1="465" y1="246" x2="465" y2="279" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- SituationalContext (MongoDB) -->
  <rect x="370" y="285" width="190" height="46" rx="6" fill="#3a2200" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="465" y="303" text-anchor="middle" fill="#ffb74d" font-size="11" font-weight="600">[user][date]-situational</text>
  <text x="465" y="318" text-anchor="middle" fill="#8b949e" font-size="8.5">MongoDB · partyData + situationSummary</text>

  <!-- ═══════════════════════════════════════════
       CONVERGENCE — fillFormMap
       ═══════════════════════════════════════════ -->
  <rect x="18" y="530" width="862" height="140" rx="8"
    fill="#161b22" stroke="#30363d" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="30" y="545" fill="#484f58" font-size="8.5" font-weight="700" letter-spacing="1.2">
    FILL FORM MAP · ONCE PER USER × FORM
  </text>
  <text x="20" y="527" fill="#8b949e" font-size="8">POST /api/filled-form-map/build</text>

  <!-- assumptionLevel param -->
  <rect x="30" y="560" width="155" height="46" rx="6" fill="#1c2333" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="107" y="578" text-anchor="middle" fill="#90a4ae" font-size="11" font-weight="600">assumptionLevel</text>
  <text x="107" y="593" text-anchor="middle" fill="#8b949e" font-size="8.5">conservative | moderate | liberal</text>

  <!-- fillFormMap (Anthropic) -->
  <rect x="320" y="560" width="190" height="46" rx="6" fill="#2a1a3a" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="415" y="578" text-anchor="middle" fill="#ce93d8" font-size="11" font-weight="600">fillFormMap</text>
  <text x="415" y="593" text-anchor="middle" fill="#8b949e" font-size="8.5">Anthropic fn · claude-opus-4-5</text>

  <!-- Arrow: FormContext → fillFormMap (long elbow from bottom of track A) -->
  <path d="M170,501 L170,513 L320,513 L320,583" fill="none"
    stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="210" y="510" fill="#8b949e" font-size="8">reads FormContext</text>

  <!-- Arrow: SituationalContext → fillFormMap (elbow from track B) -->
  <path d="M465,331 L465,513 L510,513 L510,583" fill="none"
    stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="468" y="435" fill="#8b949e" font-size="8">reads SituationalContext</text>

  <!-- Arrow: assumptionLevel → fillFormMap -->
  <line x1="185" y1="583" x2="314" y2="583" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- Arrow: fillFormMap → FilledFormMap -->
  <line x1="415" y1="606" x2="415" y2="634" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- FilledFormMap (MongoDB) -->
  <rect x="320" y="640" width="190" height="46" rx="6" fill="#3a2200" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="415" y="658" text-anchor="middle" fill="#ffb74d" font-size="11" font-weight="600">[form]-map-[user]-[date]</text>
  <text x="415" y="673" text-anchor="middle" fill="#8b949e" font-size="8.5">MongoDB · filled values + skipped audit</text>

  <!-- ══════════════════════════════
       OUTPUT — fillForm
       ══════════════════════════════ -->
  <rect x="18" y="700" width="862" height="160" rx="8"
    fill="#161b22" stroke="#30363d" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="30" y="715" fill="#484f58" font-size="8.5" font-weight="700" letter-spacing="1.2">
    FILL FORM · PRODUCE OUTPUT PDF
  </text>
  <text x="20" y="697" fill="#8b949e" font-size="8">POST /api/form-fill/fill</text>

  <!-- Blank PDF (reused) -->
  <rect x="30" y="725" width="155" height="46" rx="6" fill="#0d3349" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="107" y="743" text-anchor="middle" fill="#4fc3f7" font-size="11" font-weight="600">Blank PDF Template</text>
  <text x="107" y="758" text-anchor="middle" fill="#8b949e" font-size="8.5">disk · /forms/&lt;formId&gt;.pdf</text>

  <!-- fillForm service -->
  <rect x="320" y="725" width="190" height="46" rx="6" fill="#0d2a28" stroke="#80cbc4" stroke-width="1.5"/>
  <text x="415" y="743" text-anchor="middle" fill="#80cbc4" font-size="11" font-weight="600">fillForm</text>
  <text x="415" y="758" text-anchor="middle" fill="#8b949e" font-size="8.5">pdftk fill_form + flatten</text>

  <!-- Arrow: FilledFormMap → fillForm -->
  <line x1="415" y1="686" x2="415" y2="719" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="418" y="705" fill="#8b949e" font-size="8">reads FilledFormMap</text>

  <!-- Arrow: Blank PDF → fillForm -->
  <line x1="185" y1="748" x2="314" y2="748" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- Arrow: fillForm → Filled PDF -->
  <line x1="415" y1="771" x2="415" y2="804" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- Filled PDF (output) -->
  <rect x="320" y="810" width="190" height="46" rx="6" fill="#1a2e1a" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="415" y="828" text-anchor="middle" fill="#a5d6a7" font-size="11" font-weight="600">Filled PDF</text>
  <text x="415" y="843" text-anchor="middle" fill="#8b949e" font-size="8.5">disk · output/&lt;formId&gt;/&lt;userId&gt;-&lt;ts&gt;.pdf</text>

  <!-- ── MongoDB collections footer ── -->
  <rect x="18" y="872" width="862" height="66" rx="6"
    fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="888" fill="#484f58" font-size="8.5" font-weight="700" letter-spacing="1.2">MONGODB COLLECTIONS</text>

  <!-- FormMap -->
  <rect x="30" y="895" width="200" height="30" rx="4" fill="#3a2200" stroke="#ffb74d" stroke-width="1"/>
  <text x="38" y="907" fill="#ffb74d" font-size="10" font-weight="600">FormMap</text>
  <text x="38" y="919" fill="#8b949e" font-size="8">blank field IDs, once per form</text>

  <!-- FormContext -->
  <rect x="240" y="895" width="200" height="30" rx="4" fill="#3a2200" stroke="#ffb74d" stroke-width="1"/>
  <text x="248" y="907" fill="#ffb74d" font-size="10" font-weight="600">FormContext</text>
  <text x="248" y="919" fill="#8b949e" font-size="8">annotated field descriptions</text>

  <!-- SituationalContext -->
  <rect x="450" y="895" width="200" height="30" rx="4" fill="#3a2200" stroke="#ffb74d" stroke-width="1"/>
  <text x="458" y="907" fill="#ffb74d" font-size="10" font-weight="600">SituationalContext</text>
  <text x="458" y="919" fill="#8b949e" font-size="8">partyData per user session</text>

  <!-- FilledFormMap -->
  <rect x="660" y="895" width="200" height="30" rx="4" fill="#3a2200" stroke="#ffb74d" stroke-width="1"/>
  <text x="668" y="907" fill="#ffb74d" font-size="10" font-weight="600">FilledFormMap</text>
  <text x="668" y="919" fill="#8b949e" font-size="8">filled values per user × form</text>

</svg>
</body>
</html>
